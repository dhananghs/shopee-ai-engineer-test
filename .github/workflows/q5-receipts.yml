# Tests the receipt reader, then builds the container image from question 5.
#
# Two jobs rather than one, and the build only runs if the tests passed. An
# image that was never tested is worse than no image, because it looks ready.

name: q5-receipts

on:
  push:
    paths:
      - "part2-coding/q5-receipts/**"
      - ".github/workflows/q5-receipts.yml"
  pull_request:
    paths:
      - "part2-coding/q5-receipts/**"
      - ".github/workflows/q5-receipts.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: part2-coding/q5-receipts

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # plain postgres, not pgvector. question 5 stores no vectors, so pulling
      # the bigger image would only make the run slower.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shopee
          POSTGRES_PASSWORD: shopee
          POSTGRES_DB: receipts
        ports:
          - 5432:5432
        # without this the job can start connecting before postgres is ready
        options: >-
          --health-cmd "pg_isready -U shopee -d receipts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: part2-coding/q5-receipts/requirements.txt

      - name: install
        run: pip install -r requirements.txt

      - name: test
        run: python manage.py test --verbosity 2
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: receipts
          DB_USER: shopee
          DB_PASSWORD: shopee
          SECRET_KEY: ci-only-not-a-real-key
          # deliberately empty. every test replaces the AI call with a fake, so
          # a test that suddenly needs a key is a test that started calling the
          # real API, and it should fail here rather than quietly cost money.
          OPENROUTER_API_KEY: ""

  image:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write        # to push to ghcr.io as GITHUB_TOKEN

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # pull requests can come from forks, where the token is read only. build
      # them to prove the Dockerfile works, but do not try to push.
      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/q5-receipts
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: build
        uses: docker/build-push-action@v6
        with:
          context: part2-coding/q5-receipts
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # reuse layers between runs, otherwise every push reinstalls django
          cache-from: type=gha
          cache-to: type=gha,mode=max
